[build-system]
requires = ["setuptools>=68", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "cfgdrift"
version = "0.11.0"
description = "Semantic-level configuration drift detection system (JSON/TOML/INI parsed in C or pure Python, YAML via PyYAML)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cfgdrift team" }]
keywords = ["config", "drift", "detection", "semantic", "diff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    # Web 仪表盘测试所需（v0.4.0+）：让 dev 环境与 CI 矩阵一次装齐
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # httpx 家族：starlette.testclient 依赖
    # - 老 starlette (<0.40) 用 httpx（py3.8+）
    # - 新 starlette (>=0.40) 改用 httpx2（py3.10+）
    # 同时声明，pip 按 python_version 自动选可用版本；纯 web 场景
    # 实际只 import 一个（取决于 starlette 版本）
    "httpx>=0.24",
    'httpx2>=2.0; python_version >= "3.10"',
]

[project.scripts]
cfgdrift = "cfgdrift.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfgdrift = ["web/static/*.html", "web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
