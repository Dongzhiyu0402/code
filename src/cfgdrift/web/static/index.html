<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cfgdrift 配置漂移仪表盘</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --critical: #ef4444;
    --warn: #f59e0b;
    --info: #22c55e;
    --none: #64748b;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }
  nav {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    flex-shrink: 0;
  }
  nav h1 { font-size: 18px; margin-bottom: 20px; color: var(--accent); }
  nav h1 small { display: block; font-size: 11px; color: var(--muted); font-weight: normal; }
  nav button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    margin-bottom: 4px;
  }
  nav button:hover { background: var(--panel-2); color: var(--text); }
  nav button.active { background: var(--accent); color: #082f49; font-weight: 600; }
  main { flex: 1; padding: 24px 32px; overflow-x: auto; }
  main h2 { margin-bottom: 16px; font-size: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    min-width: 110px;
  }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .b-critical { background: rgba(239,68,68,.18); color: var(--critical); }
  .b-warn { background: rgba(245,158,11,.18); color: var(--warn); }
  .b-info { background: rgba(34,197,94,.18); color: var(--info); }
  .b-none { background: rgba(100,116,139,.18); color: var(--none); }
  input, select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  button.action {
    background: var(--accent);
    border: none;
    color: #082f49;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  button.danger {
    background: transparent;
    border: 1px solid var(--critical);
    color: var(--critical);
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .hidden { display: none; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 90px; font-size: 13px; color: var(--muted); }
  .bar-track { flex: 1; background: var(--panel-2); border-radius: 8px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; }
  .bar-num { width: 40px; text-align: right; font-size: 13px; }
  #timeline .scan-item { display: flex; justify-content: space-between; align-items: center; }
  #severitySvg { width: 100%; max-width: 420px; height: auto; }
  /* v0.4.0: line-snippet modal + masked badge + alert views */
  .masked-badge { display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: 10px; background: rgba(56,189,248,.15); color: var(--accent); margin-left: 4px; }
  /* v0.6.0: consistency-constraint violations */
  .cv { margin-bottom: 4px; font-size: 12px; line-height: 1.5; }
  .cv-id { display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: 10px; background: rgba(239,68,68,.15); color: var(--critical); margin-right: 6px; font-weight: 600; }
  .cv-type { color: var(--muted); margin-right: 4px; }
  .line-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .line-link:hover { color: #7dd3fc; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; max-width: 720px; width: 92%; max-height: 80vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-size: 15px; }
  .modal-close { background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .modal-body { padding: 12px 16px; overflow: auto; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.7; }
  .modal-body pre { margin: 0; white-space: pre; }
  .src-line { display: inline-block; width: 42px; color: var(--muted); user-select: none; }
  .src-line.hl { background: rgba(245,158,11,.25); color: var(--warn); font-weight: 700; }
  .event-error { color: var(--critical); font-size: 12px; word-break: break-all; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
  .pager button { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 4px 12px; border-radius: 8px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<nav>
  <h1>cfgdrift<small>语义级配置漂移检测</small></h1>
  <button data-view="overview" class="active">概览</button>
  <button data-view="timeline">时间线</button>
  <button data-view="severity">严重度分布</button>
  <button data-view="reports">报告浏览</button>
  <button data-view="compare">环境对比</button>
  <button data-view="baselines">基线管理</button>
  <button data-view="rules">忽略规则</button>
  <button data-view="alerts">告警管理</button>
  <button data-view="constraints">约束</button>
</nav>
<main>
  <section id="view-overview"></section>
  <section id="view-timeline" class="hidden"></section>
  <section id="view-severity" class="hidden"></section>
  <section id="view-reports" class="hidden"></section>
  <section id="view-compare" class="hidden"></section>
  <section id="view-baselines" class="hidden"></section>
  <section id="view-rules" class="hidden"></section>
  <section id="view-alerts" class="hidden"></section>
  <section id="view-constraints" class="hidden"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
